[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling", "uv-dynamic-versioning" ]

[project]
name = "locloc"
version = "0.2.0"
description = "Online LOC counter"
readme = "README.md"
keywords = [
  "badge",
  "code-analysis",
  "fastapi",
  "line-counter",
  "lines-of-code",
  "loc",
  "svg",
  "tokei",
  "web",
]
license = "MIT"
authors = [ { name = "eggplants", email = "w10776e8w@yahoo.co.jp" } ]
requires-python = ">=3.13,<4"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
  "Topic :: Utilities",
  "Typing :: Typed",
]
# dynamic = [ "version" ]
dependencies = [
  "fastapi>=0.115.6,<0.142",
  "gitpython>=3.1.47,<4",
  "jinja2>=3.1.5,<4",
  "pydantic>=2.10.5,<3",
  "pygal>=3.0.5,<4",
  "pytokei==1.0.1",
  "timeout-decorator>=0.5,<0.6",
  "uvicorn>=0.34,<0.53",
]
urls.Documentation = "https://egpl.dev/locloc/"
urls.Homepage = "https://locloc.egpl.dev"
urls.Issues = "https://github.com/eggplants/locloc/issues"
urls.Repository = "https://github.com/eggplants/locloc"
scripts.locloc-server = "locloc.cli:main"

[dependency-groups]
dev = [
  "httpx2>=2.10,<3",
  "pymarkdownlnt>=0.9.33",
  "pyproject-fmt>=2.11.1",
  "pytest>=9.0.2",
  "pytest-asyncio>=1.3",
  "pytest-cov>=7",
]
docs = [
  "pdoc>=16",
]

[tool.hatch]
version.source = "uv-dynamic-versioning"
metadata.allow-direct-references = true
build.targets.wheel.include = [
  "locloc",
  "locloc/static_files",
  "locloc/templates",
]
build.targets.sdist.include = [
  "locloc",
  "locloc/static_files",
  "locloc/templates",
]

[tool.uv]
python-downloads = "never"
default-groups = [
  "dev",
  "docs",
]
exclude-newer = "P7D"
exclude-newer-package = { pytokei = "P1D" }
preview = true

[tool.ruff]
line-length = 120
format.indent-style = "space"
format.quote-style = "double"
lint.select = [ "ALL" ]
lint.ignore = [
  "COM812",
  "CPY001", # Missing copyright notice (this project does not use file headers)
]
lint.per-file-ignores."locloc/cli.py" = [
  "T201", # `print` found
]
lint.per-file-ignores."tests/*.py" = [
  "D",
  "S101", # Use of assert detected
]
lint.pydocstyle.convention = "google"

[tool.pytest]
ini_options.testpaths = [ "tests" ]
ini_options.addopts = [ "--strict-markers", "--strict-config" ]
ini_options.xfail_strict = true
ini_options.asyncio_default_fixture_loop_scope = "function"
ini_options.asyncio_mode = "auto"

[tool.coverage]
run.source = [ "locloc" ]
report.exclude_also = [ "if __name__ == .__main__.:" ]

[tool.uv-dynamic-versioning]
vcs = "git"
style = "semver"
fallback-version = "0.0.0"

[tool.taskipy]
tasks.start = "uvicorn locloc.cli:app"
tasks.dev = "uvicorn locloc.cli:app --reload"
